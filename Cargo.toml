[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.25"
rust-version = "1.100"

[package]
name = "quantsupport-py"
version.workspace = true
rust-version.workspace = true
edition = "2021"
description = "Python bindings for the quantsupport derivative pricing and risk analytics library."
license = "MIT"
repository = "https://github.com/jmelo11/quantsupport-python"
publish = false
exclude = ["AGENTS.md", "**/AGENTS.md", ".editorconfig", "ruff.toml", ".ruff.toml", "rustfmt.toml", ".rustfmt.toml", "requirements-dev.txt", "Directory.Build.props", "PSScriptAnalyzerSettings.psd1"]

[lib]
name = "quantsupport"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
quantsupport = { git = "https://github.com/jmelo11/quantsupport", rev = "16c38918452876127d8473c3036cc7fb375b0dc4" }
pyo3 = { version = "0.29", features = ["multiple-pymethods"] }
pythonize = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"

[features]
default = []
# Enabled by maturin when building the wheel; keeps `cargo test` linkable.
extension-module = ["pyo3/extension-module"]

[profile.test]
opt-level = 2
