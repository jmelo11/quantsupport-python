name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Binding commit to build and test
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Portable native contracts
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install pandas
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test native contracts
        run: cargo +stable test --locked --workspace --all-targets

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.platform.runner }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        platform:
          - {runner: ubuntu-22.04, target: x86_64}
          - {runner: ubuntu-24.04-arm, target: aarch64}
          - {runner: windows-latest, target: x64}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {runner: macos-15, target: aarch64, deployment: '11.0'}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.deployment || '' }}
        with:
          target: ${{ matrix.platform.target }}
          manylinux: '2_28'
          args: --locked --release --compatibility pypi --manifest-path Cargo.toml --interpreter ${{ matrix.python }} --out dist
      - name: Install and test the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -v
      - name: Test release and packaging tools
        if: matrix.python == '3.12' && matrix.platform.runner == 'ubuntu-22.04'
        run: |
          python -m unittest discover -s tools/tests -p test_release.py -v
          python -m unittest discover -s tools/tests -p test_python_downloads.py -v
          python -m unittest discover -s tools/tests -p test_release_source.py -v
      - name: Execute Python examples
        if: matrix.python == '3.12' && matrix.platform.runner == 'ubuntu-22.04'
        run: |
          python -m pip install -r examples/requirements.txt
          python -m unittest discover -s examples -p test_run_notebooks.py -v
          python -m pip install -r docs/requirements.txt
          python -m unittest discover -s tools/tests -p test_reference.py -v
          python examples/run_notebooks.py
          python examples/sensitivity/risk_reprojection.py
      - name: Check type hints
        shell: bash
        run: |
          python -m pip install mypy==2.4.1 pandas-stubs==3.1.0.261029 typing-extensions==4.16.0
          python -m mypy python/quantsupport --ignore-missing-imports
          python -m mypy.stubtest quantsupport --ignore-missing-stub
          python -m mypy tests/typing_native_inputs.py --ignore-missing-imports --warn-unused-ignores
      - name: Package and test QuantSupport-only folder distribution
        run: |
          python -m unittest discover -s tools/tests -p 'test_package_portable.py' -v
          python tools/python/package_portable.py --wheel-directory dist --output dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-${{ matrix.platform.runner }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: portable-python-${{ matrix.platform.runner }}-${{ matrix.python }}
          path: dist/*-portable.zip
          if-no-files-found: error

  sdist:
    name: Python source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path Cargo.toml --out dist
      - name: Verify the source distribution builds independently
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir source-wheels
      - name: Install and test the wheel built from source
        run: |
          python -m pip install source-wheels/*.whl
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v6
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
